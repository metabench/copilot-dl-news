<svg viewBox="0 0 720 352" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Home lab status card</title>
  <desc>Status of three home-lab servers: atlas up with disk 78% full and backup at 02:14, hermes up with disk 41% and backup at 03:02, pluto down since July 18 with disk 91% and a failed backup.</desc>
  <defs>
    <linearGradient id="leatherBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf9f7"/><stop offset="55%" stop-color="#f5f3ef"/>
      <stop offset="100%" stop-color="#ebe8e2"/>
    </linearGradient>
    <linearGradient id="obsidianPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2d2d"/><stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a962"/><stop offset="100%" stop-color="#e8d5a3"/>
    </linearGradient>
    <pattern id="leatherGrain" width="6" height="6" patternUnits="userSpaceOnUse"
             patternTransform="rotate(35)">
      <rect width="6" height="6" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1a1a1a" stroke-width="0.5" opacity="0.025"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#0a0d14" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 1 · leather background + grain -->
  <rect width="720" height="352" fill="url(#leatherBg)"/>
  <rect width="720" height="352" fill="url(#leatherGrain)"/>

  <!-- 3 · the single obsidian panel -->
  <g transform="translate(40,48)" filter="url(#softShadow)">
    <rect width="640" height="248" rx="12" fill="url(#obsidianPanel)"
          stroke="#c9a962" stroke-width="1.5"/>

    <!-- 4 · labels and glyphs (local coordinates) -->
    <!-- title row -->
    <text x="24" y="34" font-family="Arial, sans-serif" font-size="16">🖥️</text>
    <text x="56" y="34" font-family="Georgia, serif" font-size="18" font-weight="bold"
          fill="#e8d5a3">Home Lab</text>
    <text x="616" y="31" text-anchor="end" font-family="Arial, sans-serif" font-size="10"
          letter-spacing="0.05em" fill="#d8d0c1">3 SERVERS · 2 UP</text>
    <line x1="24" y1="48" x2="616" y2="48" stroke="url(#goldAccent)" stroke-width="1"/>

    <!-- column headers -->
    <text x="24" y="72" font-family="Arial, sans-serif" font-size="10" letter-spacing="0.05em"
          fill="#d8d0c1">SERVER</text>
    <text x="136" y="72" font-family="Arial, sans-serif" font-size="10" letter-spacing="0.05em"
          fill="#d8d0c1">STATUS</text>
    <text x="280" y="72" font-family="Arial, sans-serif" font-size="10" letter-spacing="0.05em"
          fill="#d8d0c1">DISK USED</text>
    <text x="480" y="72" font-family="Arial, sans-serif" font-size="10" letter-spacing="0.05em"
          fill="#d8d0c1">LAST BACKUP</text>
    <line x1="24" y1="80" x2="616" y2="80" stroke="#888" stroke-width="0.75" opacity="0.35"/>

    <!-- row · atlas -->
    <text x="24" y="104" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
          font-weight="bold" fill="#faf9f7">atlas</text>
    <text x="136" y="104" font-family="JetBrains Mono, Consolas, monospace" font-size="12"
          fill="#1a8f4d">●</text>
    <text x="152" y="104" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
          fill="#faf9f7">up</text>
    <text x="280" y="104" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
          fill="#faf9f7">78%</text>
    <text x="320" y="104" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
          fill="#d8d0c1">▇▇▇▇▇▇▂▁</text>
    <text x="480" y="104" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
          fill="#1a8f4d">✓</text>
    <text x="496" y="104" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
          fill="#faf9f7">02:14</text>

    <!-- row · hermes -->
    <text x="24" y="136" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
          font-weight="bold" fill="#faf9f7">hermes</text>
    <text x="136" y="136" font-family="JetBrains Mono, Consolas, monospace" font-size="12"
          fill="#1a8f4d">●</text>
    <text x="152" y="136" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
          fill="#faf9f7">up</text>
    <text x="280" y="136" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
          fill="#faf9f7">41%</text>
    <text x="320" y="136" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
          fill="#d8d0c1">▇▇▇▂▁▁▁▁</text>
    <text x="480" y="136" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
          fill="#1a8f4d">✓</text>
    <text x="496" y="136" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
          fill="#faf9f7">03:02</text>

    <!-- row · pluto (alarm row) -->
    <text x="24" y="168" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
          font-weight="bold" fill="#faf9f7">pluto</text>
    <text x="136" y="168" font-family="JetBrains Mono, Consolas, monospace" font-size="12"
          fill="#c21f32">●</text>
    <text x="152" y="168" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
          font-weight="bold" fill="#c21f32">DOWN</text>
    <text x="152" y="184" font-family="Arial, sans-serif" font-size="10"
          fill="#d8d0c1">since Jul 18</text>
    <text x="280" y="168" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
          font-weight="bold" fill="#c21f32">91%</text>
    <text x="320" y="168" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
          fill="#d8d0c1">▇▇▇▇▇▇▇▂</text>
    <text x="480" y="168" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
          fill="#c21f32">✗</text>
    <text x="496" y="168" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
          font-weight="bold" fill="#c21f32">FAILED</text>

    <!-- footer summary -->
    <line x1="24" y1="200" x2="616" y2="200" stroke="#888" stroke-width="0.75" opacity="0.35"/>
    <text x="24" y="224" font-family="Arial, sans-serif" font-size="12" fill="#c9a962">✦</text>
    <text x="40" y="224" font-family="Arial, sans-serif" font-size="12"
          fill="#faf9f7">pluto needs attention — down since Jul 18 · backup FAILED · disk 91%</text>
  </g>

  <!-- 5 · leather caption -->
  <text x="40" y="324" font-family="Arial, sans-serif" font-size="10" fill="#c9a962">✦</text>
  <text x="54" y="324" font-family="Arial, sans-serif" font-size="10"
        fill="#666">home lab status · 2026-07-19</text>
</svg>
