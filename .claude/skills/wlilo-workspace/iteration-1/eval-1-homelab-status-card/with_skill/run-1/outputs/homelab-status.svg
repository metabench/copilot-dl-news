<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Home lab server status card</title>
  <desc>Status of three home-lab servers: atlas and hermes are up with recent backups; pluto has been down since yesterday, its disk is 91% full and its last backup failed.</desc>
  <!-- data model:
       [{"name":"atlas","state":"up","disk":78,"backup":"02:14","backup_ok":true},
        {"name":"hermes","state":"up","disk":41,"backup":"03:02","backup_ok":true},
        {"name":"pluto","state":"down","down_since":"yesterday","disk":91,"backup":"FAILED","backup_ok":false}] -->
  <defs>
    <linearGradient id="leatherBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf9f7"/><stop offset="55%" stop-color="#f5f3ef"/>
      <stop offset="100%" stop-color="#ebe8e2"/>
    </linearGradient>
    <linearGradient id="obsidianPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2d2d"/><stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a962"/><stop offset="100%" stop-color="#e8d5a3"/>
    </linearGradient>
    <pattern id="leatherGrain" width="6" height="6" patternUnits="userSpaceOnUse"
             patternTransform="rotate(35)">
      <rect width="6" height="6" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1a1a1a" stroke-width="0.5" opacity="0.025"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#0a0d14" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 1 · leather background + grain -->
  <rect width="760" height="280" fill="url(#leatherBg)"/>
  <rect width="760" height="280" fill="url(#leatherGrain)"/>

  <!-- 3 · single obsidian panel -->
  <g transform="translate(30,32)" filter="url(#softShadow)">
    <rect width="700" height="216" rx="12" fill="url(#obsidianPanel)"
          stroke="#c9a962" stroke-width="1.5"/>

    <!-- 4 · labels and glyphs -->
    <text x="24" y="34" font-size="15">🖥️</text>
    <text x="54" y="34" font-family="Georgia, serif" font-size="16" font-weight="bold"
          fill="#e8d5a3">HOME LAB — STATUS</text>
    <text x="676" y="34" text-anchor="end" font-family="Georgia, serif" font-size="14"
          fill="#c9a962">✦</text>
    <line x1="24" y1="48" x2="676" y2="48" stroke="url(#goldAccent)" stroke-width="1"/>

    <!-- column headers -->
    <g font-family="Arial, sans-serif" font-size="10" letter-spacing="0.05em" fill="#c9a962">
      <text x="28" y="78">SERVER</text>
      <text x="200" y="78">DISK USED</text>
      <text x="410" y="78">LAST BACKUP</text>
      <text x="545" y="78">STATE</text>
    </g>

    <!-- rows -->
    <g font-family="JetBrains Mono, Consolas, monospace" font-size="13">
      <!-- atlas · up · 78% · backup 02:14 -->
      <text x="28" y="108" fill="#faf9f7">atlas</text>
      <text x="200" y="108" fill="#faf9f7">▇▇▇▇▇▇▂▁ 78%</text>
      <text x="410" y="108"><tspan fill="#2ecc71">✓</tspan><tspan fill="#faf9f7"> 02:14</tspan></text>
      <text x="545" y="108" font-weight="bold" fill="#2ecc71">● UP</text>

      <!-- hermes · up · 41% · backup 03:02 -->
      <text x="28" y="142" fill="#faf9f7">hermes</text>
      <text x="200" y="142" fill="#faf9f7">▇▇▇▂▁▁▁▁ 41%</text>
      <text x="410" y="142"><tspan fill="#2ecc71">✓</tspan><tspan fill="#faf9f7"> 03:02</tspan></text>
      <text x="545" y="142" font-weight="bold" fill="#2ecc71">● UP</text>

      <!-- pluto · down since yesterday · 91% · backup failed -->
      <text x="28" y="176" fill="#faf9f7">pluto</text>
      <text x="200" y="176" fill="#faf9f7">▇▇▇▇▇▇▇▂ 91%</text>
      <text x="410" y="176" font-weight="bold" fill="#c21f32">✗ FAILED</text>
      <text x="545" y="176" font-weight="bold" fill="#c21f32">● DOWN</text>
    </g>
    <text x="545" y="192" font-family="Arial, sans-serif" font-size="10"
          fill="#d8d0c1">since yesterday</text>
  </g>
</svg>
