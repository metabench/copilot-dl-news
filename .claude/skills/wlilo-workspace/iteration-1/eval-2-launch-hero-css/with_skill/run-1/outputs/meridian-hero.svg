<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Meridian v2.0 launch hero</title>
  <desc>Launch poster for Meridian version 2.0, a data pipeline product: headline and tagline on white leather, sapphire Get started and emerald Read the docs gemstone buttons, and an obsidian panel showing the ingest, transform, deliver pipeline stages.</desc>
  <defs>
    <!-- Luxe/UI register throughout: bg #ffffff/#f6f3ee/#eae4da, obsidian #111828/#05070c,
         golds #b5a273/#d8cba9/#e6d7b5, platinum #e5e1d7, gem stops per canonical recipe -->
    <linearGradient id="leatherLuxe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#f6f3ee"/>
      <stop offset="100%" stop-color="#eae4da"/>
    </linearGradient>
    <linearGradient id="obsidianLuxe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111828"/><stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="goldLuxe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b5a273"/><stop offset="100%" stop-color="#e6d7b5"/>
    </linearGradient>
    <linearGradient id="leatherChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbf9f4"/><stop offset="100%" stop-color="#e8e1d6"/>
    </linearGradient>
    <linearGradient id="gemSapphire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/><stop offset="50%" stop-color="#1e5aad"/>
      <stop offset="100%" stop-color="#123a74"/>
    </linearGradient>
    <linearGradient id="gemEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/><stop offset="50%" stop-color="#1a8f4d"/>
      <stop offset="100%" stop-color="#0f5f33"/>
    </linearGradient>
    <linearGradient id="brushedMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e5e1d7"/><stop offset="25%" stop-color="#d8cba9"/>
      <stop offset="50%" stop-color="#e5e1d7"/><stop offset="75%" stop-color="#d8cba9"/>
      <stop offset="100%" stop-color="#e5e1d7"/>
    </linearGradient>
    <pattern id="leatherGrain" width="6" height="6" patternUnits="userSpaceOnUse"
             patternTransform="rotate(35)">
      <rect width="6" height="6" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#05070c" stroke-width="0.5" opacity="0.025"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0a0d14" flood-opacity="0.18"/>
    </filter>
    <filter id="gemGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <!-- 1 · background -->
  <rect width="1200" height="700" fill="url(#leatherLuxe)"/>
  <rect width="1200" height="700" fill="url(#leatherGrain)"/>

  <!-- 3 · panels (left column) -->
  <!-- eyebrow -->
  <g transform="translate(80,172)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" fill="#b5a273">✦</text>
    <text x="22" y="0" font-family="Arial, sans-serif" font-size="11" font-weight="600"
          letter-spacing="2" fill="#4b5262">NOW LAUNCHING · VERSION 2.0</text>
  </g>

  <!-- headline -->
  <text x="80" y="248" font-family="Georgia, serif" font-size="72" font-weight="bold"
        letter-spacing="-1.4" fill="#0a0d14">Meridian</text>

  <!-- version chip -->
  <g transform="translate(410,214)">
    <rect width="64" height="32" rx="6" fill="url(#obsidianLuxe)" stroke="#d8cba9" stroke-width="1"/>
    <text x="32" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="14"
          font-weight="bold" fill="#e6d7b5">v2.0</text>
  </g>

  <!-- tagline + support -->
  <text x="80" y="300" font-family="Georgia, serif" font-size="22" font-style="italic"
        fill="#2f3645">The data pipeline, refined.</text>
  <g transform="translate(80,342)" font-family="Arial, sans-serif" font-size="15" fill="#4b5262">
    <text x="0" y="0">Move data from every source to every destination,</text>
    <text x="0" y="24">with the clarity your team needs under load.</text>
  </g>

  <!-- gemstone CTAs: sapphire = start/primary, emerald = navigation -->
  <g transform="translate(80,412)">
    <g>
      <rect width="190" height="52" rx="8" fill="url(#obsidianLuxe)" stroke="#d8cba9" stroke-width="2"/>
      <rect x="7" y="7" width="176" height="38" rx="5" fill="url(#gemSapphire)" filter="url(#gemGlow)"/>
      <text x="95" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-size="14"
            font-weight="bold" fill="#ffffff">Get started ⟶</text>
    </g>
    <g transform="translate(210,0)">
      <rect width="190" height="52" rx="8" fill="url(#obsidianLuxe)" stroke="#d8cba9" stroke-width="2"/>
      <rect x="7" y="7" width="176" height="38" rx="5" fill="url(#gemEmerald)" filter="url(#gemGlow)"/>
      <text x="95" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-size="14"
            font-weight="bold" fill="#ffffff">Read the docs</text>
    </g>
  </g>

  <!-- obsidian pipeline panel (connectors drawn before chips inside) -->
  <g transform="translate(640,150)" filter="url(#softShadow)">
    <rect width="480" height="400" rx="12" fill="url(#obsidianLuxe)" stroke="#d8cba9" stroke-width="1.5"/>
    <text x="240" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="17"
          font-weight="bold" fill="#e6d7b5">Inside the pipeline</text>
    <line x1="24" y1="52" x2="456" y2="52" stroke="url(#goldLuxe)" stroke-width="1"/>

    <!-- 2 · connectors -->
    <line x1="240" y1="132" x2="240" y2="172" stroke="#b5a273" stroke-width="2"/>
    <polygon points="240,182 235,172 245,172" fill="#b5a273"/>
    <line x1="240" y1="232" x2="240" y2="272" stroke="#b5a273" stroke-width="2"/>
    <polygon points="240,282 235,272 245,272" fill="#b5a273"/>

    <!-- stage chips (leather on obsidian; one chip level max) -->
    <g transform="translate(150,84)">
      <rect width="180" height="48" rx="10" fill="url(#leatherChip)" stroke="#b5a273" stroke-width="1"/>
      <text x="30" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">🌐</text>
      <text x="52" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="600"
            fill="#0a0d14">Ingest</text>
      <text x="160" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14"
            fill="#b5a273">①</text>
    </g>
    <g transform="translate(150,184)">
      <rect width="180" height="48" rx="10" fill="url(#leatherChip)" stroke="#b5a273" stroke-width="1"/>
      <text x="30" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">⚙️</text>
      <text x="52" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="600"
            fill="#0a0d14">Transform</text>
      <text x="160" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14"
            fill="#b5a273">②</text>
    </g>
    <g transform="translate(150,284)">
      <rect width="180" height="48" rx="10" fill="url(#leatherChip)" stroke="#b5a273" stroke-width="1"/>
      <text x="30" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">📦</text>
      <text x="52" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="600"
            fill="#0a0d14">Deliver</text>
      <text x="160" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14"
            fill="#b5a273">③</text>
    </g>

    <text x="240" y="372" text-anchor="middle" font-family="Consolas, monospace" font-size="12"
          fill="#f0ece4">sources ⟶ meridian ⟶ destinations</text>
  </g>

  <!-- 5 · top ornaments: framing bands + house star -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#brushedMetal)"/>
  <rect x="0" y="694" width="1200" height="6" fill="url(#brushedMetal)"/>
  <text x="600" y="678" text-anchor="middle" font-family="Arial, sans-serif" font-size="14"
        fill="#b5a273">✦</text>
</svg>
